name: Build & Push Backend Image

# Chỉ build Docker image và push lên Docker Hub.
# Render deploy thủ công bằng "Existing Image" -> Manual Deploy.
# Không SSH, không deploy hook, không phụ thuộc Render trong workflow này.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-backend-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: booking-platform-backend
    env:
      # secrets không dùng được ở env cấp workflow -> khai báo ở cấp job.
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/booking-platform-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Thiếu secret DOCKERHUB_USERNAME hoặc DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Render chạy amd64; chỉ build 1 platform cho nhanh.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image đã push"
            echo ""
            echo "- \`${{ env.IMAGE_NAME }}:latest\`"
            echo "- \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo ""
            echo "Vào Render > service (Existing Image) > **Manual Deploy > Deploy latest commit** để kéo image mới."
            echo "Rollback: đổi Image URL sang tag \`${{ github.sha }}\` cũ rồi Manual Deploy."
          } >> "$GITHUB_STEP_SUMMARY"
