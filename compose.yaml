services:
  postgres:
    image: 'postgres:latest'
    container_name: booking_travel_postgres
    environment:
      - 'POSTGRES_DB=dev_booking_travel'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

