spring:
  threads:
    virtual:
      enabled: true
  config:
    import: "optional:file:.env[.properties]"
  docker:
    compose:
      enabled: false
  application:
    name: booking_travel_backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dev_booking_travel?options=-c%20timezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
  mail:
    default-encoding: UTF-8
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:tongnguyenthanhdo@gmail.com}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            require: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

mailer:
  service: gmail
  from: ${MAILER_FROM:tongnguyenthanhdo@gmail.com}

springdoc:
  packages-to-scan: com.dotnt.booking_travel_backend
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    endpoint: ${AWS_S3_ENDPOINT}
    region: ${AWS_S3_REGION}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    bucket-name: ${AWS_S3_BUCKET_NAME}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  jwt:
    secret: ${APP_JWT_SECRET:default-secret-key-must-be-at-least-256-bits-long-to-be-secure-for-hmac-sha-256}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  flight:
    api-key: ${FLIGHT_TRACKING_API_KEY:}
  opensky:
    client-id: ${OPENSKY_CLIENT_ID:}
    client-secret: ${OPENSKY_CLIENT_SECRET:}
  currency:
    api-base-url: ${CURRENCY_API_BASE_URL}
    api-key: ${CURRENCY_API_KEY}

seed:
  admin:
    email: ${SEED_ADMIN_EMAIL}
    password: ${SEED_ADMIN_PASSWORD}
    phone: ${SEED_ADMIN_PHONE}
    fullname: ${SEED_ADMIN_FULLNAME}
  moderator:
    email: ${SEED_MODERATOR_EMAIL}
    password: ${SEED_MODERATOR_PASSWORD}
    phone: ${SEED_MODERATOR_PHONE}
    fullname: ${SEED_MODERATOR_FULLNAME}
  staff:
    email: ${SEED_STAFF_EMAIL}
    password: ${SEED_STAFF_PASSWORD}
    phone: ${SEED_STAFF_PHONE}
    fullname: ${SEED_STAFF_FULLNAME}
  customer:
    email: ${SEED_CUSTOMER_EMAIL}
    password: ${SEED_CUSTOMER_PASSWORD}
    phone: ${SEED_CUSTOMER_PHONE}
    fullname: ${SEED_CUSTOMER_FULLNAME}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}
  folder: ${CLOUDINARY_FOLDER:booking_travel}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
