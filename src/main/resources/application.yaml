spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  threads:
    virtual:
      enabled: true
  config:
    import: "optional:file:.env[.properties]"
  docker:
    compose:
      enabled: false
  application:
    name: booking_travel_backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dev_booking_travel?options=-c%20timezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # N+1 mitigation: low general batch size (10-40 recommended). Bigger values
        # pre-build huge "Static select" IN queries that blast heap memory.
        # Only opt into @BatchSize(...) on hot collections to override this default.
        default_batch_fetch_size: 20
        format_sql: true
        show_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  mail:
    default-encoding: UTF-8
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:tongnguyenthanhdo@gmail.com}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            require: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

mailer:
  service: gmail
  from: ${MAILER_FROM:tongnguyenthanhdo@gmail.com}

springdoc:
  packages-to-scan: com.dotnt.booking_travel_backend
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:8333}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_S3_ACCESS_KEY:any_key}
    secret-key: ${AWS_S3_SECRET_KEY:any_secret}
    bucket-name: ${AWS_S3_BUCKET_NAME:booking-travel-bucket}

app:
  portal-url: ${APP_PORTAL_URL:http://localhost:3000/portal/bookings}
  booking:
    # WARN stores the server-computed line price and logs any gap with what the browser sent.
    # ENFORCE additionally refuses to book a line the server could not price. Anything other
    # than WARN/ENFORCE fails at startup — the property converts straight into the enum.
    server-price-mode: ${APP_BOOKING_SERVER_PRICE_MODE:WARN}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  jwt:
    secret: ${APP_JWT_SECRET:default-secret-key-must-be-at-least-256-bits-long-to-be-secure-for-hmac-sha-256}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  flight:
    api-key: ${FLIGHT_TRACKING_API_KEY:}
  opensky:
    client-id: ${OPENSKY_CLIENT_ID:}
    client-secret: ${OPENSKY_CLIENT_SECRET:}
  currency:
    api-base-url: ${CURRENCY_API_BASE_URL:https://v1.apiplugin.com/v1/currency}
    api-key: ${CURRENCY_API_KEY:}

